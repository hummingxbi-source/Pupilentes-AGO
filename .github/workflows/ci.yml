# CI en cada push a cualquier rama y en cada PR a main (ARQUITECTURA §7.1).
# Un PR no se une a main con el CI en rojo; una fase no se cierra con el CI en rojo.
# Seguridad del CI (§6.1 regla 16): permisos mínimos, acciones fijadas por commit,
# nunca `pull_request_target`, sin secretos de producción (proveedores simulados).
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DENO_VERSION: 'v2.x'

jobs:
  calidad:
    name: calidad (lint, tipos, unitarias, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: '${{ env.DENO_VERSION }}' }
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: deno check (Edge Functions)
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts
      - name: Vitest (frontend)
        run: npm test
      - name: deno test (Edge Functions)
        run: deno test --allow-env tests/unit/funciones
      - name: Build
        run: npm run build

  seguridad:
    name: seguridad (gitleaks, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (historial completo)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: npm audit (altas y críticas rompen el CI)
        run: npm audit --omit=dev --audit-level=high

  bd:
    name: bd (migraciones desde cero + pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with: { version: '2.122.1' }
      - name: Levantar solo Postgres
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Migraciones y semilla desde cero
        run: supabase db reset --local
      - name: pgTAP
        run: supabase test db
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Reimportar la semilla no duplica nada (importador contra la BD real)
        run: |
          antes=$(psql "postgresql://postgres:postgres@127.0.0.1:55322/postgres" -Atc "select sum(stock) || '/' || count(*) from public.variantes")
          node scripts/importar-catalogo.mjs plantillas/catalogo-semilla.csv --aplicar
          despues=$(psql "postgresql://postgres:postgres@127.0.0.1:55322/postgres" -Atc "select sum(stock) || '/' || count(*) from public.variantes")
          echo "antes=$antes despues=$despues"; test "$antes" = "$despues"
      - name: Concurrencia real (última pieza en paralelo)
        run: npm run test:concurrencia

  integracion:
    name: integracion (Edge Functions reales + tests/seguridad)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Secretos SOLO de prueba (§6.1 regla 16): Mercado Pago es el simulador local y Turnstile usa
      # la llave de prueba de Cloudflare que siempre aprueba [Cloudflare: Turnstile testing].
      MP_NOTIFICATION_URL: http://127.0.0.1:55321/functions/v1/webhook-mercadopago
      CRON_SECRET: cron-local-solo-desarrollo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with: { version: '2.122.1' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Levantar Supabase (BD, Auth, API y funciones)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor
      - name: Secrets de las funciones (solo prueba)
        run: |
          MP_WEBHOOK_SECRET=$(openssl rand -hex 24)   # se generan en cada corrida
          ENVIA_WEBHOOK_SECRET=$(openssl rand -hex 24)
          echo "MP_WEBHOOK_SECRET=$MP_WEBHOOK_SECRET" >> "$GITHUB_ENV"
          echo "ENVIA_WEBHOOK_SECRET=$ENVIA_WEBHOOK_SECRET" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/funciones.env" <<EOF
          ORIGENES_PERMITIDOS=http://localhost:5173
          CRON_SECRET=$CRON_SECRET
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          SITIO_URL=http://localhost:5173
          MP_ACCESS_TOKEN=TEST-ci
          MP_WEBHOOK_SECRET=$MP_WEBHOOK_SECRET
          MP_NOTIFICATION_URL=$MP_NOTIFICATION_URL
          MP_API_URL=http://host.docker.internal:8090
          ENVIA_TOKEN=TEST-ci
          ENVIA_API_URL=http://host.docker.internal:8091
          ENVIA_WEBHOOK_SECRET=$ENVIA_WEBHOOK_SECRET
          EOF
      - name: Mercado Pago y Envia simulados
        run: |
          MP_SIM_HOST=0.0.0.0 nohup node scripts/mp-simulado.mjs > "$RUNNER_TEMP/mp.log" 2>&1 &
          MP_SIM_HOST=0.0.0.0 ENVIA_WEBHOOK_URL="http://127.0.0.1:55321/functions/v1/webhook-envia?s=$ENVIA_WEBHOOK_SECRET" \
            nohup node scripts/envia-simulado.mjs > "$RUNNER_TEMP/envia.log" 2>&1 &
          timeout 20 sh -c 'until curl -s -o /dev/null http://127.0.0.1:8090/; do sleep 1; done'
          timeout 20 sh -c 'until curl -s -o /dev/null http://127.0.0.1:8091/; do sleep 1; done'
      - name: Servir las funciones
        run: |
          nohup supabase functions serve --env-file "$RUNNER_TEMP/funciones.env" > "$RUNNER_TEMP/funciones.log" 2>&1 &
          # El runtime puede reiniciarse una vez al cargar todas las funciones: se exigen 3 respuestas seguidas
          seguidas=0
          for i in $(seq 1 120); do
            if curl -fs http://127.0.0.1:55321/functions/v1/salud > /dev/null; then seguidas=$((seguidas+1)); else seguidas=0; fi
            if [ "$seguidas" -ge 3 ]; then echo "funciones listas"; exit 0; fi
            sleep 2
          done
          echo "las funciones no arrancaron"; cat "$RUNNER_TEMP/funciones.log"; exit 1
      - name: El contenedor de funciones alcanza al simulador
        run: docker exec "$(docker ps --filter name=edge_runtime -q | head -1)" sh -c 'getent hosts host.docker.internal || true'
      - name: tests/seguridad (pedidos, pagos, envíos, rastreo, panel con MFA)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" SUPABASE_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          node --test --test-concurrency=1 "tests/seguridad/*.test.mjs"
      - name: Registros si algo falló
        if: failure()
        run: |
          echo "::group::funciones"; tail -n 200 "$RUNNER_TEMP/funciones.log"; echo "::endgroup::"
          echo "::group::mp simulado"; tail -n 100 "$RUNNER_TEMP/mp.log"; echo "::endgroup::"
          echo "::group::envia simulado"; tail -n 100 "$RUNNER_TEMP/envia.log"; echo "::endgroup::"

  # e2e: se activa en la Fase 8 (Playwright, solo en PR a main).
